<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Pipeline</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            text-align: center;
        }
        header {
            background: #1e293b;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            padding: 40px;
        }
        .box {
            display: inline-block;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            background: #1e293b;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .flow {
            font-size: 20px;
            margin-top: 30px;
        }
        .highlight {
            color: #38bdf8;
            font-weight: bold;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            background: #1e293b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    🚀 DevOps CI/CD Pipeline Dashboard
</header>

<div class="container">

    <h2>Hello, I'm Rashpal 👨‍💻</h2>
    <p>This application is deployed using a complete DevOps pipeline.</p>

    <div class="flow">
        <span class="highlight">GitHub</span> ➝ 
        <span class="highlight">Jenkins</span> ➝ 
        <span class="highlight">Docker</span> ➝ 
        <span class="highlight">AWS EC2</span>
    </div>

    <div>
        <div class="box">🔧 CI: Build & Test</div>
        <div class="box">⚙️ CD: Deploy</div>
        <div class="box">🐳 Docker Container</div>
        <div class="box">☁️ Cloud (EC2)</div>
    </div>

</div>

<footer>
    Built with ❤️ by Rashpal | DevOps Engineer
</footer>

</body>
</html>
